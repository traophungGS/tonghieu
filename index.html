<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn Toán Tổng Hiệu</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{font-family:'Nunito',sans-serif;background:#f0fdf4;user-select:none;-webkit-user-select:none}::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:#f1f5f9}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}::-webkit-scrollbar-thumb:hover{background:#94a3b8}.bounce-short{animation:bounce .5s ease infinite alternate}@keyframes bounce{0%{transform:translateY(0)}100%{transform:translateY(-6px)}}
</style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">
<main class="max-w-5xl mx-auto px-4 py-6 flex-grow w-full">
<section id="setup-panel" class="bg-white rounded-3xl p-6 md:p-8 shadow-xl border border-emerald-100 max-w-2xl mx-auto space-y-6"><div class="text-center space-y-2"><span class="inline-block bg-amber-100 text-amber-800 px-4 py-1.5 rounded-full text-xs font-extrabold uppercase"><i class="fa-solid fa-shuffle text-amber-500 mr-1"></i> Đề Ngẫu Nhiên</span><h2 class="text-2xl md:text-3xl font-black">Tùy Chọn Luyện Tập</h2><p class="text-sm text-slate-500 font-medium">Hệ thống sẽ tạo đề bài mới ngẫu nhiên</p></div><div class="space-y-4"><div><label class="block text-xs font-extrabold uppercase text-slate-600 mb-2">Chọn dạng bài Toán:</label><select id="cfg-type" class="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl px-4 py-3 font-bold focus:border-emerald-500 focus:outline-none"><option value="all">🌟 HỖN HỢP</option><option value="pure">Dạng 1: Cho trực tiếp</option><option value="story">Dạng 2: Bài toán Lời văn</option><option value="avg">Dạng 3: Dạng Trung bình cộng</option><option value="geom">Dạng 4: Dạng Hình học</option><option value="hidden">Dạng 5: Tổng & Hiệu ẩn</option></select></div><div><label class="block text-xs font-extrabold uppercase text-slate-600 mb-2">Số lượng câu hỏi:</label><div class="grid grid-cols-3 gap-3"><button type="button" onclick="selectCount(5)" id="cnt-btn-5" class="cnt-opt-btn border-2 border-emerald-500 bg-emerald-50 text-emerald-700 font-black py-2.5 rounded-2xl">5 Câu</button><button type="button" onclick="selectCount(10)" id="cnt-btn-10" class="cnt-opt-btn border-2 border-slate-200 font-bold py-2.5 rounded-2xl">10 Câu</button><button type="button" onclick="selectCount(15)" id="cnt-btn-15" class="cnt-opt-btn border-2 border-slate-200 font-bold py-2.5 rounded-2xl">15 Câu</button></div></div></div><button onclick="startQuiz()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-black text-lg py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2"><i class="fa-solid fa-dice text-xl"></i> SINH ĐỀ & BẮT ĐẦU LÀM BÀI</button></section>
<section id="quiz-panel" class="hidden space-y-6"><div class="bg-white rounded-2xl p-4 shadow-sm border flex flex-wrap justify-between items-center gap-4"><div class="flex items-center gap-3"><span id="q-counter" class="bg-emerald-100 text-emerald-800 font-black px-3.5 py-1.5 rounded-xl text-sm">Câu 1 / 5</span><span id="q-type-label" class="bg-blue-50 text-blue-700 font-bold px-3 py-1.5 rounded-xl text-xs">Dạng toán</span></div><div class="text-right"><span class="text-xs font-bold text-slate-400 block uppercase">Điểm số</span><span id="score-display" class="text-lg font-black text-amber-500"><i class="fa-solid fa-trophy mr-1"></i>0</span></div></div>
<div class="bg-white rounded-3xl p-6 md:p-8 shadow-xl border relative"><div class="mb-6"><div class="flex justify-between items-center mb-2"><h3 class="text-xs font-black uppercase text-emerald-600 tracking-wider"><i class="fa-solid fa-circle-question"></i> Đề bài:</h3><span id="tag-seed" class="text-[10px] font-mono bg-slate-100 text-slate-500 px-2 py-0.5 rounded-md">ID: #0000</span></div><p id="q-text" class="text-lg md:text-xl font-bold leading-relaxed bg-slate-50 p-4 rounded-2xl border">Đang tạo câu hỏi...</p></div>
<div class="bg-emerald-50/50 p-5 rounded-2xl border border-emerald-100 space-y-4 mb-6"><div class="text-xs font-extrabold uppercase text-emerald-700"><i class="fa-solid fa-pen-to-square"></i> Nhập kết quả tính toán:</div><div class="grid grid-cols-1 md:grid-cols-2 gap-4"><div><label id="lbl-n1" class="block text-sm font-bold mb-1.5">Số lớn:</label><input type="number" id="ans-n1" placeholder="Nhập số..." class="w-full bg-white border-2 border-slate-300 focus:border-emerald-500 rounded-xl px-4 py-3 text-lg font-extrabold focus:outline-none"></div><div><label id="lbl-n2" class="block text-sm font-bold mb-1.5">Số bé:</label><input type="number" id="ans-n2" placeholder="Nhập số..." class="w-full bg-white border-2 border-slate-300 focus:border-emerald-500 rounded-xl px-4 py-3 text-lg font-extrabold focus:outline-none"></div></div></div>
<div id="feedback-box" class="hidden mb-6 p-4 rounded-2xl font-bold text-sm flex items-start gap-3"><i id="fb-icon" class="text-xl mt-0.5"></i><div id="fb-text" class="space-y-1"></div></div>
<div class="flex flex-wrap items-center justify-between gap-3 pt-2 border-t"><button onclick="toggleHint()" class="text-xs font-bold text-amber-700 bg-amber-50 border border-amber-200 px-4 py-2.5 rounded-xl"><i class="fa-solid fa-lightbulb text-amber-500"></i> Xem gợi ý & Lời giải</button><div class="flex items-center gap-2 ml-auto"><button onclick="checkCurrentAnswer()" id="btn-check" class="bg-emerald-600 text-white font-extrabold px-6 py-3 rounded-xl shadow-md"><i class="fa-solid fa-check-double"></i> Kiểm Tra Bài Làm</button><button onclick="nextQuestion()" id="btn-next" class="hidden bg-blue-600 text-white font-extrabold px-6 py-3 rounded-xl shadow-md items-center gap-2">Câu tiếp theo <i class="fa-solid fa-arrow-right"></i></button></div></div>
<div id="hint-box" class="hidden mt-6 pt-5 border-t-2 border-dashed bg-amber-50/60 p-5 rounded-2xl text-sm"><div class="font-black text-amber-900 text-base mb-2"><i class="fa-solid fa-book-open text-amber-600"></i> HƯỚNG DẪN GIẢI:</div><div id="hint-summary" class="font-bold text-xs bg-white/80 p-2.5 rounded-xl border mb-3"></div><div id="hint-steps" class="space-y-2"></div></div></div></section>
<section id="result-panel" class="hidden bg-white rounded-3xl p-6 md:p-10 shadow-2xl border max-w-2xl mx-auto text-center space-y-6"><div id="res-badge" class="w-24 h-24 mx-auto rounded-full bg-amber-100 text-amber-500 flex items-center justify-center text-5xl"><i class="fa-solid fa-trophy"></i></div><div><h2 id="res-title" class="text-3xl font-black mb-1">Hoàn thành!</h2><p id="res-subtitle" class="text-slate-500 text-sm font-bold">Em đã hoàn thành bộ đề.</p></div><div class="grid grid-cols-2 gap-4 bg-slate-50 p-4 rounded-2xl border"><div class="p-3 bg-white rounded-xl"><span class="text-xs font-extrabold text-slate-400 block uppercase">Số câu đúng</span><span id="res-correct" class="text-2xl font-black text-emerald-600">0 / 0</span></div><div class="p-3 bg-white rounded-xl"><span class="text-xs font-extrabold text-slate-400 block uppercase">Tổng điểm</span><span id="res-score" class="text-2xl font-black text-amber-500">0</span></div></div><div class="pt-2 flex flex-col sm:flex-row gap-3"><button onclick="restartQuiz()" class="flex-1 bg-emerald-600 text-white font-extrabold py-3.5 rounded-2xl"><i class="fa-solid fa-dice"></i> Sinh Đề Mới</button><button onclick="returnToSetup()" class="flex-1 bg-slate-100 text-slate-700 font-extrabold py-3.5 rounded-2xl"><i class="fa-solid fa-sliders"></i> Tùy Chọn Dạng Bài</button></div></section>
</main>
<script>
'use strict';
const AudioFX={ctx:null,init(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!this.ctx)this.ctx=new C();if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});}catch(e){console.warn('Audio unavailable',e);}},play(freqs,type='sine',duration=.4){try{this.init();if(!this.ctx||this.ctx.state!=='running')return;const now=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;freqs.forEach(([f,t])=>o.frequency.setValueAtTime(f,now+t));g.gain.setValueAtTime(.15,now);g.gain.exponentialRampToValueAtTime(.001,now+duration);o.connect(g);g.connect(this.ctx.destination);o.start(now);o.stop(now+duration);}catch(e){console.warn('Audio unavailable',e);}},playCorrect(){this.play([[523.25,0],[659.25,.1],[783.99,.2]],'sine',.4);},playWrong(){this.play([[220,0],[180,.15]],'sawtooth',.35);}};
let selectedCount=5,quizProblems=[],currentIndex=0,score=0,correctCount=0,isAnswered=false;
const randInt=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;
const randPick=arr=>arr[Math.floor(Math.random()*arr.length)];
function selectCount(cnt){selectedCount=cnt;document.querySelectorAll('.cnt-opt-btn').forEach(b=>b.className='cnt-opt-btn border-2 border-slate-200 font-bold py-2.5 rounded-2xl');const b=document.getElementById(`cnt-btn-${cnt}`);b.className='cnt-opt-btn border-2 border-emerald-500 bg-emerald-50 text-emerald-700 font-black py-2.5 rounded-2xl';}
function makeProblem(type,n1,n2,text,label1='Số lớn',label2='Số bé',unit='',summary=''){const sum=n1+n2,diff=n1-n2;return{type,id:randInt(1000,9999),num1:n1,num2:n2,sum,diff,questionText:text,label1,label2,unit,summaryText:summary||`Tổng = ${sum} | Hiệu = ${diff}`,explanation:[`<b>${label1}</b> = (${sum} + ${diff}) : 2 = <b>${n1}</b>`,`<b>${label2}</b> = ${n1} - ${diff} = <b>${n2}</b>`,`<b>Đáp số:</b> ${label1}: ${n1}; ${label2}: ${n2}`]};}
function generateDynamicProblem(type){let n1,n2,sum,diff,avg,p;
if(type==='pure'){n2=randInt(15,350);diff=randInt(10,250);n1=n2+diff;sum=n1+n2;return makeProblem(type,n1,n2,randPick([`Cho hai số có tổng bằng ${sum} và hiệu là ${diff}. Tìm hai số đó.`,`Tổng của hai số là ${sum}. Số lớn hơn số bé ${diff} đơn vị. Hãy tìm hai số.`]));}
if(type==='story'){if(Math.random()<.5){n2=randInt(6,20);diff=randInt(20,36);n1=n2+diff;sum=n1+n2;let a=randPick([['Mẹ','con'],['Bố','con'],['Anh','em'],['Chị','em']]);return makeProblem(type,n1,n2,`Hiện nay tổng số tuổi của ${a[0]} và ${a[1]} là ${sum} tuổi. ${a[0]} hơn ${a[1]} ${diff} tuổi. Hỏi mỗi người bao nhiêu tuổi?`,a[0],a[1],'tuổi',`Tổng tuổi = ${sum} | Hiệu = ${diff}`);}else{n2=randInt(40,400);diff=randInt(20,180);n1=n2+diff;sum=n1+n2;let u=randPick(['kg','lít','bao']);return makeProblem(type,n1,n2,`Hai kho chứa tổng cộng ${sum} ${u}. Kho thứ nhất nhiều hơn kho thứ hai ${diff} ${u}. Hỏi mỗi kho chứa bao nhiêu?`,'Kho thứ nhất','Kho thứ hai',u,`Tổng = ${sum} ${u} | Hiệu = ${diff} ${u}`);}}
if(type==='avg'){let sub=randPick(['diff','ratio','sum']);if(sub==='ratio'){let k=randInt(2,6);n2=randInt(10,80);if((n2*(k+1))%2)n2++;n1=n2*k;sum=n1+n2;avg=sum/2;p=makeProblem(type,n1,n2,`Trung bình cộng của hai số là ${avg}. Biết số lớn gấp ${k} lần số bé. Tìm hai số đó.`);p.summaryText=`TBC = ${avg} | Tổng = ${sum} | Số lớn = ${k} × Số bé`;p.explanation=[`Tổng hai số = ${avg} × 2 = <b>${sum}</b>`,`Tổng số phần = ${k}+1 = ${k+1}`,`Số bé = ${sum} : ${k+1} = <b>${n2}</b>`,`Số lớn = ${n2} × ${k} = <b>${n1}</b>`];return p;}n2=randInt(15,300);diff=randInt(10,160);n1=n2+diff;sum=n1+n2;avg=sum/2;return makeProblem(type,n1,n2,sub==='diff'?`Trung bình cộng của hai số là ${avg}. Hiệu của hai số bằng ${diff}. Tìm hai số đó.`:`Trung bình cộng của hai số là ${avg}. Số thứ nhất nhiều hơn số thứ hai ${diff} đơn vị. Tìm hai số đó.`,'Số lớn','Số bé','',`TBC = ${avg} | Tổng = ${sum} | Hiệu = ${diff}`);}
if(type==='geom'){let sub=randPick(['perim','half','triangle']);if(sub==='triangle'){n2=randInt(15,40);diff=randInt(6,20);n1=n2+diff;let c3=randInt(10,25);while(c3>=n1+n2||n1>=n2+c3||n2>=n1+c3)c3=randInt(10,25);sum=n1+n2;let perimeter=sum+c3;p=makeProblem(type,n1,n2,`Một tam giác có chu vi ${perimeter} cm. Cạnh thứ ba dài ${c3} cm. Cạnh thứ nhất dài hơn cạnh thứ hai ${diff} cm. Tính hai cạnh còn lại.`,'Cạnh thứ nhất','Cạnh thứ hai','cm',`Tổng hai cạnh = ${perimeter} - ${c3} = ${sum} cm | Hiệu = ${diff} cm`);p.explanation=[`Tổng hai cạnh còn lại = ${perimeter} - ${c3} = <b>${sum}</b> cm`,`Cạnh thứ nhất = (${sum} + ${diff}) : 2 = <b>${n1}</b> cm`,`Cạnh thứ hai = ${n1} - ${diff} = <b>${n2}</b> cm`];return p;}n2=randInt(12,120);diff=randInt(8,60);n1=n2+diff;sum=n1+n2;let unit=sub==='half'?'cm':'m',half=sum,perimeter=half*2;p=makeProblem(type,n1,n2,sub==='half'?`Một hình chữ nhật có nửa chu vi ${half} cm. Chiều dài hơn chiều rộng ${diff} cm. Tính chiều dài và chiều rộng.`:`Một khu vườn hình chữ nhật có chu vi ${perimeter} m. Chiều dài hơn chiều rộng ${diff} m. Tính chiều dài và chiều rộng.`,'Chiều dài','Chiều rộng',unit,`${sub==='half'?'Nửa chu vi':'Chu vi'} = ${sub==='half'?half:perimeter}${unit} | Hiệu = ${diff}${unit}`);p.explanation=[`Nửa chu vi = ${sub==='half'?half:`${perimeter} : 2 = ${half}`} ${unit}`,`Chiều dài = (${half} + ${diff}) : 2 = <b>${n1}</b> ${unit}`,`Chiều rộng = ${n1} - ${diff} = <b>${n2}</b> ${unit}`];return p;}
if(type==='hidden'){let sub=randPick(['even','max','min']);if(sub==='even'){let step=randInt(1,4),even=Math.random()>.5;diff=(step+1)*2;n2=even?randInt(10,100)*2:randInt(10,100)*2+1;n1=n2+diff;sum=n1+n2;return makeProblem(type,n1,n2,`Tìm hai số ${even?'chẵn':'lẻ'} có tổng bằng ${sum}, biết rằng giữa chúng có ${step} số ${even?'chẵn':'lẻ'} khác.`,'Số lớn','Số bé','',`Tổng = ${sum} | Hiệu = ${diff}`);}if(sub==='max'){sum=Math.random()>.5?99:999;diff=randInt(1,20)*2+1;n1=(sum+diff)/2;n2=(sum-diff)/2;return makeProblem(type,n1,n2,`Tìm hai số biết tổng của chúng là số lớn nhất có ${sum===99?2:3} chữ số (${sum}) và hiệu là ${diff}.`);}diff=Math.random()>.5?10:100;sum=randInt(30,200)*2;n1=(sum+diff)/2;n2=(sum-diff)/2;return makeProblem(type,n1,n2,`Tìm hai số có tổng bằng ${sum} và hiệu là số nhỏ nhất có ${diff===10?2:3} chữ số (${diff}).`);}
return generateDynamicProblem('pure');}
function startQuiz(){const selectedType=document.getElementById('cfg-type').value,types=['pure','story','avg','geom','hidden'];quizProblems=[];for(let i=0;i<selectedCount;i++){const type=selectedType==='all'?types[i%types.length]:selectedType;quizProblems.push(generateDynamicProblem(type));}currentIndex=0;score=0;correctCount=0;document.getElementById('setup-panel').classList.add('hidden');document.getElementById('result-panel').classList.add('hidden');document.getElementById('quiz-panel').classList.remove('hidden');renderCurrentQuestion();}
function getTypeTitle(type){return({'pure':'Tổng & Hiệu Thuần Túy','story':'Toán Lời Văn','avg':'Trung Bình Cộng','geom':'Hình Học','hidden':'Tổng & Hiệu Ẩn'})[type]||'Tổng - Hiệu';}
function renderCurrentQuestion(){isAnswered=false;const p=quizProblems[currentIndex];document.getElementById('q-counter').textContent=`Câu ${currentIndex+1} / ${quizProblems.length}`;document.getElementById('q-type-label').textContent=getTypeTitle(p.type);document.getElementById('score-display').innerHTML=`<i class="fa-solid fa-trophy mr-1"></i>${score}`;document.getElementById('tag-seed').textContent=`ID: #${p.id}`;document.getElementById('q-text').textContent=p.questionText;document.getElementById('lbl-n1').textContent=`${p.label1}:`;document.getElementById('lbl-n2').textContent=`${p.label2}:`;const a=document.getElementById('ans-n1'),b=document.getElementById('ans-n2');a.value='';b.value='';a.disabled=false;b.disabled=false;document.getElementById('feedback-box').className='hidden mb-6 p-4 rounded-2xl font-bold text-sm flex items-start gap-3';document.getElementById('hint-box').classList.add('hidden');document.getElementById('btn-check').classList.remove('hidden');document.getElementById('btn-next').className='hidden bg-blue-600 text-white font-extrabold px-6 py-3 rounded-xl shadow-md items-center gap-2';document.getElementById('hint-summary').innerHTML=`📌 <b>Tóm tắt:</b> ${p.summaryText}`;document.getElementById('hint-steps').innerHTML=p.explanation.map(s=>`<p class="leading-relaxed">• ${s}</p>`).join('');}
function checkCurrentAnswer(){if(isAnswered)return;const p=quizProblems[currentIndex],a=document.getElementById('ans-n1'),b=document.getElementById('ans-n2');const v1=a.value.trim()===''?NaN:Number(a.value),v2=b.value.trim()===''?NaN:Number(b.value),box=document.getElementById('feedback-box'),icon=document.getElementById('fb-icon'),txt=document.getElementById('fb-text');if(!Number.isFinite(v1)||!Number.isFinite(v2)){box.className='mb-6 p-4 rounded-2xl font-bold text-sm bg-amber-50 text-amber-800 border border-amber-200 flex items-start gap-3';icon.className='fa-solid fa-circle-exclamation text-amber-500 text-xl mt-0.5';txt.textContent='Em hãy nhập đầy đủ kết quả vào cả 2 ô trước khi kiểm tra nhé!';box.classList.remove('hidden');return;}isAnswered=true;a.disabled=true;b.disabled=true;const correct=v1===p.num1&&v2===p.num2;if(correct){score+=10;correctCount++;AudioFX.playCorrect();box.className='mb-6 p-4 rounded-2xl font-bold text-sm bg-emerald-50 text-emerald-900 border border-emerald-200 flex items-start gap-3';icon.className='fa-solid fa-circle-check text-emerald-500 text-xl mt-0.5';txt.innerHTML=`<div><b>Rất chuẩn xác! 🎉 (+10 điểm)</b></div><div class="text-xs text-emerald-700 mt-1">${p.label1}: ${p.num1} ${p.unit} | ${p.label2}: ${p.num2} ${p.unit}</div>`;}else{AudioFX.playWrong();box.className='mb-6 p-4 rounded-2xl font-bold text-sm bg-rose-50 text-rose-900 border border-rose-200 flex items-start gap-3';icon.className='fa-solid fa-circle-xmark text-rose-500 text-xl mt-0.5';txt.innerHTML=`<div><b>Kết quả chưa chính xác rồi!</b></div><div class="text-xs text-rose-700 mt-1">Đáp án đúng là: ${p.label1} = <b>${p.num1}</b>, ${p.label2} = <b>${p.num2}</b>. Hãy xem hướng dẫn giải bên dưới nhé!</div>`;document.getElementById('hint-box').classList.remove('hidden');}box.classList.remove('hidden');document.getElementById('score-display').innerHTML=`<i class="fa-solid fa-trophy mr-1"></i>${score}`;document.getElementById('btn-check').classList.add('hidden');const next=document.getElementById('btn-next');next.classList.remove('hidden');next.classList.add('flex');next.innerHTML=currentIndex===quizProblems.length-1?'Xem Kết Quả <i class="fa-solid fa-trophy ml-1"></i>':'Câu Tiếp Theo <i class="fa-solid fa-arrow-right ml-1"></i>';}
function nextQuestion(){if(!isAnswered)return;if(currentIndex<quizProblems.length-1){currentIndex++;renderCurrentQuestion();}else showFinalResults();}
function toggleHint(){document.getElementById('hint-box').classList.toggle('hidden');}
function showFinalResults(){document.getElementById('quiz-panel').classList.add('hidden');document.getElementById('result-panel').classList.remove('hidden');document.getElementById('res-correct').textContent=`${correctCount} / ${quizProblems.length}`;document.getElementById('res-score').textContent=`${score} điểm`;const badge=document.getElementById('res-badge'),title=document.getElementById('res-title'),sub=document.getElementById('res-subtitle'),ratio=correctCount/quizProblems.length;if(ratio===1){badge.className='w-24 h-24 mx-auto rounded-full bg-amber-100 text-amber-500 flex items-center justify-center text-5xl shadow-inner bounce-short';badge.innerHTML='<i class="fa-solid fa-crown"></i>';title.textContent='Xuất Sắc! Điểm Tuyệt Đối!';sub.textContent='Em đã trả lời đúng tất cả các câu!';}else if(ratio>=.7){badge.className='w-24 h-24 mx-auto rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-5xl';badge.innerHTML='<i class="fa-solid fa-star"></i>';title.textContent='Làm Bài Rất Tốt!';sub.textContent='Em đã nắm khá vững dạng toán Tổng - Hiệu!';}else{badge.className='w-24 h-24 mx-auto rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-5xl';badge.innerHTML='<i class="fa-solid fa-thumbs-up"></i>';title.textContent='Cố Gắng Lên Nhé!';sub.textContent='Hãy xem lại hướng dẫn giải và thử làm đề mới nhé!';}}
function restartQuiz(){startQuiz();}function returnToSetup(){document.getElementById('result-panel').classList.add('hidden');document.getElementById('quiz-panel').classList.add('hidden');document.getElementById('setup-panel').classList.remove('hidden');}
</script>
</body>
